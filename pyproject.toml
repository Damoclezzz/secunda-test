[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Asynchronous payment-processing service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.140.8,<1",
    "faststream[rabbit]>=0.7.2,<0.8",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2,<3",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_service"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
