services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-test:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: payments_test
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${TEST_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  rabbitmq-test:
    image: rabbitmq:4.3.4-management-alpine
    profiles: ["test"]
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "${TEST_RABBITMQ_PORT}:5672"
      - "${TEST_RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/rabbitmq

  api:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn payment_service.entrypoints.api:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: "${ENVIRONMENT}"
      LOG_LEVEL: "${LOG_LEVEL}"
      API_KEY: "${API_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          request = urllib.request.Request("http://localhost:8000/health", headers={"X-API-Key": os.environ["API_KEY"]})
          urllib.request.urlopen(request, timeout=2)
      interval: 10s
      timeout: 3s
      retries: 15

  publisher:
    build: .
    command: ["python", "-m", "payment_service.entrypoints.publisher"]
    deploy:
      replicas: 2
    environment:
      ENVIRONMENT: "${ENVIRONMENT}"
      LOG_LEVEL: "${LOG_LEVEL}"
      API_KEY: "${API_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE}"
      OUTBOX_POLL_INTERVAL: "${OUTBOX_POLL_INTERVAL}"
      OUTBOX_CLAIM_SECONDS: "${OUTBOX_CLAIM_SECONDS}"
      RABBITMQ_PUBLISH_TIMEOUT: "${RABBITMQ_PUBLISH_TIMEOUT}"
      OUTBOX_RETRY_DELAY: "${OUTBOX_RETRY_DELAY}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "payment_service.entrypoints.messaging_health"]
      interval: 10s
      timeout: 5s
      retries: 3

  consumer:
    build: .
    command: ["python", "-m", "payment_service.entrypoints.consumer"]
    deploy:
      replicas: 2
    environment:
      ENVIRONMENT: "${ENVIRONMENT}"
      LOG_LEVEL: "${LOG_LEVEL}"
      API_KEY: "${API_KEY}"
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      RABBITMQ_PUBLISH_TIMEOUT: "${RABBITMQ_PUBLISH_TIMEOUT}"
      PROCESSING_CLAIM_SECONDS: "${PROCESSING_CLAIM_SECONDS}"
      PROCESSING_CLAIM_POLL_INTERVAL: "${PROCESSING_CLAIM_POLL_INTERVAL}"
      PAYMENT_PROCESSING_MIN_DELAY: "${PAYMENT_PROCESSING_MIN_DELAY}"
      PAYMENT_PROCESSING_MAX_DELAY: "${PAYMENT_PROCESSING_MAX_DELAY}"
      PAYMENT_PROCESSING_SUCCESS_RATE: "${PAYMENT_PROCESSING_SUCCESS_RATE}"
      WEBHOOK_TIMEOUT: "${WEBHOOK_TIMEOUT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "payment_service.entrypoints.messaging_health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  rabbitmq-data:
