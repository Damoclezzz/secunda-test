services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 10s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn payment_service.entrypoints.api:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      API_KEY: local-development-api-key
      DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          request = urllib.request.Request("http://localhost:8000/health", headers={"X-API-Key": os.environ["API_KEY"]})
          urllib.request.urlopen(request, timeout=2)
      interval: 10s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
